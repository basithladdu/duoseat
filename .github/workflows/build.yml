name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the C# compiler that ships with Windows
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: DuoSeat
          path: dist/DuoSeat.exe
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/DuoSeat.exe --clobber || true
