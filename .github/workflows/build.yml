name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the C# compiler that ships with Windows
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: DuoSeat
          path: dist/DuoSeat.exe
      # Release assets are uploaded by hand after the tests in test/ pass on a real PC.
